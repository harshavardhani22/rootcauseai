tes the schema mismatch.'},{name:'DQ signal',detail:'Type validation breached after the source update.',why:'Supports the same failure chain.'},{name:'Dependency signal',detail:'7 downstream pipelines consume the affected table.',why:'Defines the blast radius.'},{name:'Historical signal',detail:'A similar schema change produced the same pattern.',why:'Increases confidence in the diagnosis.'}]};
let DATA=JSON.parse(JSON.stringify(DEMO_DATA));const $=s=>document.querySelector(s),toast=(x)=>{const t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2800)};function statusBadge(s){const c=s==='HEALTHY'?'healthy':s==='FAILED'?'failed':'warning';return `<span class="badge ${c}">${s}</span>`}function render(){const d=DATA;$('#overview').innerHTML=`<div class="kpis"><div class="kpi" style="--accent:var(--blue)"><small>TOTAL PIPELINES</small><strong>${d.kpis.total_pipelines}</strong><div class="trend">↑ 12% monitored this week</div></div><div class="kpi" style="--accent:var(--green)"><small>HEALTHY</small><strong>${d.kpis.healthy}</strong><div class="trend">Stable pipeline health</div></div><div class="kpi" style="--accent:var(--red)"><small>ACTIVE FAILURES</small><strong id="activeKpi">${d.kpis.active_failures}</strong><div class="trend" style="color:#f87171">Requires attention</div></div><div class="kpi" style="--accent:var(--purple)"><small>ROOT CAUSES DETECTED</small><strong>${d.kpis.root_causes}</strong><div class="trend">↑ 4 this week</div></div><div class="kpi" style="--accent:var(--cyan)"><small>AVG RESOLUTION TIME</small><strong>${d.kpis.avg_resolution}</strong><div class="trend">↓ 18% vs prior period</div></div></div><div class="grid2"><div><div class="card"><div class="head"><h2>Pipeline Health</h2><span>Live monitoring</span></div><div class="health-row header"><span>Pipeline</span><span>Status</span><span>Last Run</span><span>Duration</span><span>Health</span></div>${d.pipelines.map(p=>`<div class="health-row"><b>${p.name}</b>${statusBadge(p.status)}<span>${p.last_run}</span><span>${p.duration}</span><div class="healthbar"><i style="width:${p.health}%"></i></div></div>`).join('')}</div><div class="card ai"><div class="ai-top"><div class="head" style="margin:0"><h2>AI Root-Cause Analysis</h2></div><span class="ai-tag">EXPLAINABLE AI</span></div><div class="diagnosis">${d.root_cause.type}</div><div class="confidence">${d.root_cause.confidence}% confidence · ${d.root_cause.severity} severity</div><div class="meter"><i></i></div><div class="mismatch"><div class="typebox"><small>EXPECTED TYPE</small><b>${d.root_cause.expected}</b></div><div class="arrow">→</div><div class="typebox" style="border-color:#6c3037"><small>RECEIVED TYPE</small><b style="color:#f87171">${d.root_cause.actual}</b></div></div><div class="flow"><div class="flow-item"><span>Pipeline failure</span><b>Detected</b></div><div class="flow-item"><span>Schema validation</span><b>Mismatch</b></div><div class="flow-item"><span>Downstream impact</span><b>${d.root_cause.impact.pipelines} pipelines · ${d.root_cause.impact.dashboards} dashboards</b></div></div><div class="recommend"><small>RECOMMENDED ACTION</small><p>${d.root_cause.recommendation}</p><button class="btn purple" id="fixBtn">Apply Remediation</button> <button class="btn" id="whyBtn">Why this?</button></div></div></div><div><div class="card"><div class="head"><h2>Root Cause Distribution</h2><span>Last 30 days</span></div><div class="donut"></div><div class="legend">${d.root_causes.map((x,i)=>`<div><span><i style="background:${["var(--purple)","var(--blue)","var(--amber)","var(--red)"][i]}"></i>${x.name}</span><b>${x.value}%</b></div>`).join('')}</div></div><div class="card"><div class="head"><h2>Data Quality Monitoring</h2><span>Current snapshot</span></div><div class="quality"><div class="q"><div class="ring" style="--v:${d.quality.schema_consistency}" data-v="${d.quality.schema_consistency}"></div><small>Schema consistency</small></div><div class="q"><small>Duplicate rows</small><b>${d.quality.duplicate_rows}</b><span style="font-size:8px;color:#4ade80">Clean</span></div><div class="q"><small>Negative amounts</small><b>${d.quality.negative_amounts}</b><span style="font-size:8px;color:#4ade80">Clean</span></div><div class="q"><small>Invalid records</small><b>${d.quality.invalid_records}%</b><span style="font-size:8px;color:#fbbf24">Review</span></div></div></div></div></div><div class="grid3"><div class="card"><div class="head"><h2>Pipeline Failures Over Time</h2><span>12 intervals</span></div><div class="chart"><div class="bars">${d.timeline.map(v=>`<div class="bar" style="height:${v*4.2}px" title="${v} incidents"></div>`).join('')}</div></div></div><div class="card"><div class="head"><h2>Impact Analysis</h2><span>Dependency graph</span></div><div class="impact"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="node n1 red">Failed pipeline</div><div class="node n2">7 downstream pipelines</div><div class="node n3">2 dashboards</div><div class="node n4">1 ML model</div><div class="core"><div><b>customer_id</b><small>INTEGER → STRING</small></div></div></div></div><div class="card"><div class="head"><h2>Recent Incidents</h2><span>Latest events</span></div><table class="table"><thead><tr><th>ID</th><th>Cause</th><th>Conf.</th></tr></thead><tbody>${d.incidents.slice(0,4).map(i=>`<tr><td>${i.id}</td><td>${i.root_cause}</td><td>${i.confidence}</td></tr>`).join('')}</tbody></table></div></div>`;bindOverview()}
function bindOverview(){

function renderLineage(){const d=DATA;$('#lineage').innerHTML=`<div class="card"><div class="head"><h2>Lineage & Impact</h2><span>Root cause: ${d.root_cause.type}</span></div><div class="impact" style="height:420px"><div class="node n1 red">customer_id<br>Source column</div><div class="node n2">PySpark transform<br>Type mismatch</div><div class="node n3">customer_360<br>Warehouse table</div><div class="node n4">2 dashboards + 1 ML model</div><div class="core"><div><b>7 pipelines</b><small>downstream impact</small></div></div></div></div>`}
function renderSignals(){const d=DATA;$('#signals').innerHTML=`<div class="card"><div class="head"><h2>Evidence Correlation</h2><span>${d.root_cause.confidence}% diagnosis confidence</span></div><div class="timeline">${d.signals.map(s=>`<div class="signal"><div><b>${s.name}</b><p>${s.detail}</p><span style="font-size:8px;color:#667b97">${s.why}</span></div></div>`).join('')}</div></div>`}
function openModal(title,text,info){$('#mtitle').textContent=title;$('#mtext').textContent=text;$('#minfo').textContent=info;$('#modal').classList.add('show')}$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
const names={overview:['Pipeline Intelligence','Monitor pipeline health, detect anomalies and identify root causes automatically.'],incidents:['Incident Queue','Investigate failures from evidence to impact.'],pipelines:['Pipeline Registry','Monitor status, runtime, records and health.'],lineage:['Lineage & Impact','Trace the changed field to downstream assets.'],signals:['Signal Correlation','See the evidence contributing to the AI diagnosis.']};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');$('#pageTitle').textContent=names[b.dataset.view][0];$('#pageSub').textContent=names[b.dataset.view][1];window.scrollTo(0,0)});
$('#scanBtn').onclick=async()=>{const b=$('#scanBtn');b.disabled=true;b.textContent='Analyzing…';try{const r=await fetch('/api/analyze',{method:'POST'});const x=await r.json();toast(x.message||'AI analysis complete')}catch(_){toast('Demo AI scan complete — Schema Drift confirmed at 96%')}finally{setTimeout(()=>{b.disabled=false;b.textContent='Run AI Scan ↗'},700)}};
$('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#overview .health-row:not(.header)').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'grid':'none')};
async function refreshFromBackend(){try{const r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw new Error('Dashboard API returned '+r.status);const remote=await r.json();DATA=remote;render();renderIncidents();renderPipelines();renderLineage();renderSignals();try{const me=await fetch('/api/me',{cache:'no-store'}).then(x=>x.json());if(me.user)$('#userName').textContent=me.user.name}catch(_){};if(location.protocol!=='file:')toast('✓ Live backend connected')}catch(err){render();renderIncidents();renderPipelines();renderLineage();renderSignals();if(location.protocol==='file:')toast('Demo mode: open with python run.py for live backend data');else toast('Demo data loaded — backend unavailable')}}refreshFromBackend();
</script></body></html>
